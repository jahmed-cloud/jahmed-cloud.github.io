    <script>
      // Apply the saved or system theme before first paint, and enable scroll-reveal
      // animations only when JavaScript runs. If the app hasn't started within 3s,
      // drop the animation class so content is never left hidden.
      (function () {
        var root = document.documentElement, saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', dark);
        root.classList.add('js');
        setTimeout(function () { if (!window.__appReady) root.classList.remove('js'); }, 3000);
      })();
    </script>
